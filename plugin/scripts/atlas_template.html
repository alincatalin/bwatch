<title>bw atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap">
<style>
/* bw design system. Neutral ink shell; hue is reserved for evidence kinds. Iris means "written by an AI" everywhere,
   so the Ask surface and the agent's words share it. Interactive things are ink, not colored. */
:root{
  --bg:#f5f5f7; --panel:#ffffff; --raise:#fafafb; --fg:#14161b; --muted:#5a6070; --faint:#8a90a0; --line:#e3e4ea; --tint:#eeeff3; --hi:#e6e7ee;
  --side:#0e1016; --side-fg:#e9eaf0; --side-muted:#8e94a6; --side-line:#222633; --side-hi:#1c2030;
  --ai:#6349c9; --ai-soft:#efecfb; --ai-line:#cfc6f3;
  --ran:#0a7658; --ran-soft:#e0f3ec; --read:#1d5bc4; --read-soft:#e3ecfb; --gap:#8a5b00; --gap-soft:#fbf0d3;
  --chg:#b93f10; --chg-soft:#fbe7db; --ne:#bf2238; --ne-soft:#fbe1e5;
  --r:10px; --r-s:6px; --shadow:0 1px 2px rgba(16,18,27,.05),0 4px 14px rgba(16,18,27,.05);
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0c11; --panel:#11141b; --raise:#151922; --fg:#e9eaf0; --muted:#9aa0b2; --faint:#6a7083; --line:#222633; --tint:#191d27; --hi:#222736;
  --side:#06070a; --side-fg:#e9eaf0; --side-muted:#8e94a6; --side-line:#1b1f2a; --side-hi:#171b26;
  --ai:#a898f7; --ai-soft:#211b3d; --ai-line:#3d3370;
  --ran:#4fd1a5; --ran-soft:#0e2b23; --read:#7fb0ff; --read-soft:#13233f; --gap:#e6b84a; --gap-soft:#30260b;
  --chg:#ff9c66; --chg-soft:#381f13; --ne:#ff7d8a; --ne-soft:#3b151b; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0c11; --panel:#11141b; --raise:#151922; --fg:#e9eaf0; --muted:#9aa0b2; --faint:#6a7083; --line:#222633; --tint:#191d27; --hi:#222736;
  --side:#06070a; --side-fg:#e9eaf0; --side-muted:#8e94a6; --side-line:#1b1f2a; --side-hi:#171b26;
  --ai:#a898f7; --ai-soft:#211b3d; --ai-line:#3d3370;
  --ran:#4fd1a5; --ran-soft:#0e2b23; --read:#7fb0ff; --read-soft:#13233f; --gap:#e6b84a; --gap-soft:#30260b;
  --chg:#ff9c66; --chg-soft:#381f13; --ne:#ff7d8a; --ne-soft:#3b151b; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--read);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:12.5px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:26px;font-weight:600} h2{font-size:16px;font-weight:600} h3{font-size:14px;font-weight:600}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)} .faint{color:var(--faint)}
p{margin:0}

/* app shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:16px 12px;overflow:auto;
  padding-top:calc(16px + env(safe-area-inset-top,0px))}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em;padding:0 6px}
.logo .mk{width:24px;height:24px;border-radius:7px;background:var(--side-fg);color:var(--side);display:grid;place-items:center;font:600 12px var(--mono)}
.logo small{font:400 11px var(--mono);color:var(--side-muted);margin-left:auto}
.repos{display:grid;gap:2px}
.repo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:7px 9px;cursor:pointer;color:var(--side-fg)}
.repo:hover{background:var(--side-hi)} .repo[aria-current="true"]{background:var(--side-hi);border-color:var(--side-line)}
.repo .n{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo .s{grid-column:1/-1;font:11px var(--mono);color:var(--side-muted)}
.repo .c{font:11px var(--mono);color:var(--side-muted)}
.addrepo{font-size:12px;color:var(--side-muted);padding:2px 9px}
.askbtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--ai-line);background:linear-gradient(135deg,rgba(124,98,230,.22),rgba(124,98,230,.06));color:var(--side-fg);border-radius:9px;padding:9px 10px;cursor:pointer;text-align:left;font-size:13.5px}
.askbtn:hover{background:linear-gradient(135deg,rgba(124,98,230,.34),rgba(124,98,230,.12))}
.askbtn kbd{margin-left:auto;font:11px var(--mono);color:var(--side-muted);border:1px solid var(--side-line);border-radius:4px;padding:0 5px}
.side .askbtn{border-color:#4a3f8c}
.nav{display:grid;gap:1px}
.nav button{display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--side-muted);padding:7px 9px;border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px;position:relative}
.nav button:hover{background:var(--side-hi);color:var(--side-fg)}
.nav button[aria-current="true"]{background:var(--side-hi);color:var(--side-fg);font-weight:500}
.nav button[aria-current="true"]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--side-fg)}
.nav .g{font:13px var(--mono);width:16px;text-align:center}
.nav .ct{margin-left:auto;font:11px var(--mono);border-radius:999px;padding:0 6px;background:var(--side-line);color:var(--side-fg)}
.nav .ct.hot{background:#5a1e28;color:#ffb3bb}
.side .foot{margin-top:auto;display:grid;gap:8px;font-size:11.5px;color:var(--side-muted);padding:0 6px}
.keybtn{border:1px solid var(--side-line);background:none;color:var(--side-muted);border-radius:7px;padding:5px 8px;cursor:pointer;text-align:left;font-size:12px}
.keybtn:hover{color:var(--side-fg)}
.menu{display:none}
.main{min-width:0;padding-block:22px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:960px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
.sheet>*,.sec>*,.head>*{min-width:0}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .side .logo{padding:0}.side .logo small{display:none}
  .menu{display:block;margin-left:auto;border:1px solid var(--side-line);background:none;color:var(--side-fg);border-radius:8px;padding:5px 10px;cursor:pointer}
  .side>.repos,.side>.nav,.side>.foot,.side>.askbtn,.side>.addrepo{display:none;width:100%}
  .side.open>.repos,.side.open>.nav,.side.open>.foot{display:grid}.side.open>.askbtn{display:flex}
  .nav button[aria-current="true"]::before{display:none}
}

/* evidence marks: glyph + word + border style carry the meaning; hue repeats it */
.ev{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:999px;padding:0 8px;line-height:21px;white-space:nowrap;border:1px solid transparent;background:none;cursor:default}
.ev i{font-style:normal;font-family:var(--mono)}
button.ev{cursor:pointer} button.ev:hover{filter:brightness(.96)}
.ev.ran{color:var(--ran);background:var(--ran-soft)} .ev.broke{color:var(--ran);border-color:var(--ran)}
.ev.read{color:var(--read);background:var(--read-soft)} .ev.doc{color:var(--read);border:1px dashed var(--read)}
.ev.says{color:var(--ai);background:var(--ai-soft)} .ev.gap{color:var(--gap);background:var(--gap-soft)}
.ev.chg{color:var(--chg);background:var(--chg-soft)} .ev.ne{color:var(--ne);background:var(--ne-soft)}
.ev.maybe{color:var(--ne);border:1px dashed var(--ne)}
.ev.nb{color:var(--gap);border:1px dashed var(--gap)} .ev.you{color:var(--fg);background:var(--hi)}

/* top of main */
.trail{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;color:var(--muted);max-width:960px;margin:0 auto 16px}
.trail button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:1px 10px;cursor:pointer;font-size:12.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trail button[aria-current="true"]{border-color:var(--fg);font-weight:500}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.head{display:grid;gap:10px}
.claim{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.015em;text-wrap:balance}
.lede{font-size:15.5px;max-width:68ch;color:var(--muted)}
.evrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:11px 14px;border-radius:var(--r);background:var(--ne-soft);border:1px solid transparent}
.banner .g{font-family:var(--mono);color:var(--ne);font-weight:600}
.banner.seen{background:var(--chg-soft)} .banner.seen .g{color:var(--chg)}
.sec{display:grid;gap:10px}
.sec>header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec>header .q{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{background:var(--tint)} .btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)} .btn.pri:hover{opacity:.9}
.btn.ai{border-color:var(--ai-line);color:var(--ai);background:var(--ai-soft)} .btn[disabled]{opacity:.5;cursor:default}

/* overview */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{padding:14px 16px;display:grid;gap:4px;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow)}
.tile:hover{border-color:var(--faint)}
.tile .n{font:600 26px/1 var(--sans);letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.tile .n small{font:500 12px var(--mono);color:var(--muted)}
.tile .d{font-size:13px;color:var(--muted)}
.cap{display:grid;gap:6px}
.cap>.ch{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cap .says-line{font-size:13px;color:var(--muted)}
.blist{display:grid;overflow:hidden}
.bi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);text-align:left;background:none;cursor:pointer;width:100%}
.bi:last-child{border-bottom:0} .bi:hover{background:var(--raise)}
.bi .t{font-size:14px} .bi .ev-s{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-content:start}
.bi .id{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.bi .new{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--chg);margin-right:7px;vertical-align:middle}
@media (max-width:560px){.bi{grid-template-columns:1fr}.bi .ev-s{justify-content:flex-start}}

/* behaviors table */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13.5px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{font:500 11px var(--mono);opacity:.7;margin-left:4px}
details.grp{border:0;background:none}
details.grp>summary{cursor:pointer;padding:6px 2px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline;list-style:none}
details.grp>summary::before{content:"▸";font:12px var(--mono);color:var(--muted)} details.grp[open]>summary::before{content:"▾"}
details.grp>summary::-webkit-details-marker{display:none}

/* statements, table */
.stmts{display:grid;gap:2px;margin:0;padding:6px;list-style:none}
.stmt{display:grid;grid-template-columns:158px minmax(0,1fr);gap:8px;align-items:baseline;padding:6px 8px;border-radius:7px;cursor:default}
.stmt[data-row]{cursor:pointer}
.stmt:hover,.stmt.hl{background:var(--tint)}
.stmt .src{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (max-width:560px){.stmt{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--raise);white-space:nowrap}
td.v{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
td.sit{min-width:200px}
tr.hl td{background:var(--read-soft)}
tr.case{cursor:pointer} tr.case:hover td{background:var(--raise)}
.v-true{color:var(--ran)} .v-false{color:var(--muted)} .v-null{color:var(--faint);font-style:italic}
.was{text-decoration:line-through;color:var(--faint);margin-right:4px}
.also{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.tnote{font-size:12.5px;color:var(--muted)}

/* outcomes (states seen) */
.lanes{display:grid;gap:0}
.lane{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.lane:last-child{border-bottom:0}
.lane .val{font-family:var(--mono);font-size:12.5px;font-weight:500;word-break:break-word}
.lane .sits{display:flex;flex-wrap:wrap;gap:4px}
.sitc{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:1px 8px;font-size:12.5px;cursor:pointer}
.sitc:hover{border-color:var(--faint)}
@media (max-width:560px){.lane{grid-template-columns:1fr;gap:4px}}

/* ladder */
.ladder{padding:14px 16px;display:grid;gap:10px}
.ladder svg{width:100%;height:auto;display:block}
.ladder .ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px}
.ladder input[type=range]{flex:1 1 220px;accent-color:var(--fg)}
.readout{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.readout b{font-family:var(--mono);font-weight:500}

/* rows */
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.row .sub{grid-column:2;font-size:12.5px;color:var(--muted);min-width:0}
.row .sub code{white-space:pre-wrap;word-break:break-word}
.go{border:0;background:none;padding:0;color:var(--fg);cursor:pointer;text-align:left;font-weight:600;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.go:hover{text-decoration-color:var(--fg)}
.ref{border:0;background:none;padding:0;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--read);text-align:left}
.ref:hover{text-decoration:underline}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.rule .nm{font-family:var(--mono);font-size:13px;font-weight:500}
.rule .uses{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;align-items:baseline}
details.more{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
details.more>summary{cursor:pointer;padding:9px 12px;font-size:13px}
details.more .in{padding:0 12px 10px;display:grid;gap:4px}
.rd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:12.5px;align-items:baseline}
.rd code{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* history */
.hist{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:8px 2px 4px}
.hp{display:grid;justify-items:center;gap:3px;min-width:128px;max-width:150px;padding:0 6px;position:relative;font-size:11.5px;color:var(--muted);text-align:center}
.hp::before{content:"";position:absolute;top:9px;left:0;right:0;height:1px;background:var(--line)}
.hp:first-child::before{left:50%} .hp:last-child::before{right:50%}
.dot{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;position:relative;z-index:1;background:var(--panel);border:1.5px solid var(--ran);color:var(--ran)}
.dot.c{border-color:var(--chg);color:var(--chg);background:var(--chg-soft)} .dot.x{border-color:var(--gap);color:var(--gap);border-style:dashed}
.hp .when{font-family:var(--mono);color:var(--fg);white-space:nowrap}

/* paths (questions and AI answers) */
.path{list-style:none;margin:0;padding:0;display:grid;gap:0}
.st{display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 12px;position:relative;padding-bottom:16px}
.st::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px}
.st.ran .k{background:var(--ran-soft);color:var(--ran)} .st.read .k{background:var(--read-soft);color:var(--read)}
.st.says .k{background:var(--ai-soft);color:var(--ai)} .st.gap .k{background:var(--gap-soft);color:var(--gap);border:1.5px dashed var(--gap)}
.st .b{display:grid;gap:5px;padding-top:3px;min-width:0}
.st.gap .b>.say{color:var(--gap);font-weight:500}
.st .detail{font-size:12.5px;color:var(--muted);min-width:0}
.st .detail code{white-space:pre-wrap;word-break:break-word}
.cite{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:baseline;font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.cite code{white-space:pre-wrap;word-break:break-word}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.br{border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;background:var(--panel);display:grid;gap:3px}
.tally{display:flex;flex-wrap:wrap;gap:6px}

/* ask */
.askbox{border:1px solid var(--ai-line);border-radius:14px;background:var(--panel);box-shadow:0 0 0 4px var(--ai-soft),var(--shadow);padding:6px;display:flex;gap:6px;flex-wrap:wrap}
.askbox input{flex:1 1 240px;border:0;background:none;padding:10px 12px;font-size:16px;min-width:0;outline:none}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.hits{display:grid;gap:0;overflow:hidden}
.hit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;align-items:baseline}
.hit:last-child{border-bottom:0}.hit:hover{background:var(--raise)}
.hit .sub{grid-column:2;font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ainote{border:1px solid var(--ai-line);background:var(--ai-soft);border-radius:var(--r);padding:10px 14px;font-size:13px;display:grid;gap:4px}

/* edges */
.edge{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}
.edge>div{border:1px dashed var(--faint);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;align-content:start}
.edge ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.size{display:grid;gap:3px}
.sz{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12.5px}
.sz .bar{height:8px;border-radius:2px;background:var(--tint);position:relative;overflow:hidden}
.sz .bar>span{position:absolute;inset:0 auto 0 0;background:var(--faint);opacity:.55}
.sz .bar>span.cov{background:var(--ran);opacity:.8}
.sz .n{font-family:var(--mono);text-align:right;color:var(--muted)}

/* drawer + legend */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:20;
  box-shadow:-16px 0 40px rgba(0,0,0,.14);display:grid;grid-template-rows:auto minmax(0,1fr);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);transition:transform .18s ease}
.drawer[hidden]{display:grid!important;transform:translateX(105%);visibility:hidden}
.drawer .dh{display:flex;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h2{flex:1;font-size:14.5px}
.drawer .db{overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.x{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:2px 9px;cursor:pointer;font:12px var(--mono)}
pre{margin:0;background:var(--tint);border-radius:8px;padding:9px 11px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:13px;margin:0}
.kv>dt{color:var(--muted)} .kv>dd{margin:0;min-width:0;word-break:break-word}
.legend{display:grid;gap:8px}
.legend>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:baseline;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="logo"><span class="mk">bw</span>atlas<small id="built"></small></div>
    <button class="menu" id="menu" aria-expanded="false">Menu</button>
    <div class="repos" id="repos" aria-label="Repositories"></div>
    <div class="addrepo" id="addrepo"></div>
    <button class="askbtn" data-go="ask"><span aria-hidden="true">✦</span> Ask about this system <kbd>K</kbd></button>
    <nav class="nav" id="nav" aria-label="Views"></nav>
    <div class="foot"><button class="keybtn" id="keybtn">How to read the marks  ( ? )</button><span id="where"></span></div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Evidence">
  <div class="dh"><h2 id="dt">Evidence</h2><button class="x" id="dx" aria-label="Close">Esc</button></div>
  <div class="db" id="db"></div>
</aside>

<script>
const RAW = /*__MODEL__*/null;
const MODELS = Array.isArray(RAW) ? RAW : [RAW];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EV = {
  ran:{g:"▶",w:"ran",t:"A probe ran this through the real code and printed it.",not:"That it is correct, or that other inputs behave the same."},
  broke:{g:"⊘",w:"break-tested",t:"bw planted small breaks in the covered code and the probe's output changed.",not:"Full coverage."},
  nb:{g:"⊘",w:"not break-tested",t:"bw never planted a break for this probe, so it is unknown whether its output would notice a bug.",not:"That the probe is weak. It is untested."},
  read:{g:"⌕",w:"read in code",t:"A line bw read in the code when the atlas was built.",not:"That the line runs, or runs in that order."},
  doc:{g:"❝",w:"doc says",t:"A project document contains this quote.",not:"An independent source. Docs often copy code."},
  says:{g:"✦",w:"AI's words",t:"Written by an AI agent. Nothing checked it unless a row or line is attached.",not:"Evidence."},
  gap:{g:"?",w:"not shown",t:"Nothing bw has run or read shows this.",not:"That it is false."},
  chg:{g:"Δ",w:"changed",t:"The probe's output differs between two code snapshots.",not:"That the change is a bug."},
  ne:{g:"≠",w:"disagrees",t:"Two sources give different answers for the same thing.",not:"Which of the two is right."},
  maybe:{g:"≟",w:"may disagree",t:"Two probes print different values for fields with similar names in the same situation. Nobody has said the fields mean the same thing.",not:"A confirmed contradiction."},
  you:{g:"●",w:"you",t:"A decision or a visit recorded for you.",not:"Evidence about the code."}
};
const ev = (k, word, btn, attrs) => `<${btn ? "button" : "span"} class="ev ${k}" title="${esc(EV[k].t)}" ${attrs || ""}><i>${EV[k].g}</i>${word === "" ? "" : esc(word == null ? EV[k].w : word)}</${btn ? "button" : "span"}>`;
const base = f => (f || "").split("/").pop();
const when = t => { if (!t) return "time not recorded"; const d = new Date(t * 1000); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); };
const slug = m => m.repo.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "repo";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const short = (s, n) => s.length > n ? s.slice(0, n - 3) + "…" : s;
const val = v => v == null ? '<span class="v-null">—</span>' : `<span class="v-${esc(v)}">${esc(v)}</span>`;
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };

// ---------- current repository ----------
let M, B, headTime, SEEN, trail = [], view = "home";
function useRepo(m) {
  if (M === m) return;
  M = m; B = Object.fromEntries(M.behaviors.map(b => [b.id, b])); trail = [];
  const h = M.behaviors.flatMap(b => b.history).find(h => h.label === "last commit"); headTime = h ? h.at : null;
  SEEN = store.get("bw-atlas-seen:" + slug(M)) || {at: null, b: {}};
  M._dis = null;
}
const capOf = id => M.capabilities.find(c => c.behaviors.includes(id));
const caseMap = b => Object.fromEntries(b.cases.filter(c => !c.unparsed).map(c => [c.label, c.fields]));
// what changed since this person last opened the behavior (kept in this browser only)
function sinceSeen(b) {
  const s = SEEN.b[b.id]; if (!s) return null;
  const now = caseMap(b), cells = [];
  for (const [label, f] of Object.entries(now)) { const old = s.cases[label]; if (!old) { cells.push({label, added: true}); continue; }
    for (const [k, v] of Object.entries(f)) if (String(old[k]) !== String(v)) cells.push({label, field: k, before: old[k], after: v}); }
  for (const label of Object.keys(s.cases)) if (!(label in now)) cells.push({label, removed: true});
  return cells.length ? {at: s.at, cells} : null;
}
function markSeen(b) { SEEN.b[b.id] = {at: Math.floor(Date.now() / 1000), cases: caseMap(b)}; SEEN.at = SEEN.at || SEEN.b[b.id].at; store.set("bw-atlas-seen:" + slug(M), SEEN); }

// two probes, same situation: do they agree?
function words(k) { return k.replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase().split(/[^a-z]+/).filter(w => w.length > 3); }
function disagreements() {
  if (M._dis) return M._dis;
  const out = [], eq = M.equivalents || [];
  for (let i = 0; i < M.behaviors.length; i++) for (let j = i + 1; j < M.behaviors.length; j++) {
    const a = M.behaviors[i], b = M.behaviors[j];
    for (const ca of a.cases) { if (ca.unparsed) continue; const cb = b.cases.find(x => x.label === ca.label && !x.unparsed); if (!cb) continue;
      for (const [fa, va] of Object.entries(ca.fields)) for (const [fb, vb] of Object.entries(cb.fields)) {
        if (String(va) === String(vb)) continue;
        const decl = eq.find(e => (e.a === a.id + "." + fa && e.b === b.id + "." + fb) || (e.b === a.id + "." + fa && e.a === b.id + "." + fb));
        const alike = fa !== "→" && fb !== "→" && (fa === fb || words(fa).some(w => words(fb).includes(w)));   // free-text results are not comparable
        if (decl || alike) out.push({a: a.id, b: b.id, label: ca.label, fa, va, fb, vb, declared: !!decl, says: decl && decl.says});
      } }
  }
  return M._dis = out;
}
const disFor = (id, label) => disagreements().filter(d => (d.a === id || d.b === id) && (label == null || d.label === label))
  .map(d => d.a === id ? d : {...d, a: d.b, b: d.a, fa: d.fb, va: d.vb, fb: d.fa, vb: d.va});
function flags(b) {
  const s = sinceSeen(b), d = disFor(b.id);
  return {chg: b.changes.length, stale: !!b.claim_stale, differs: (b.assertions || []).filter(a => a.status === "differs").length,
    dis: d.filter(x => x.declared).length, maybe: d.filter(x => !x.declared).length, nb: !b.broke, unseen: !!s, norun: b.exit !== 0};
}
const attention = b => { const f = flags(b); return (f.stale || f.differs || f.dis ? 8 : 0) + (f.unseen ? 4 : 0) + (f.chg ? 2 : 0) + (f.maybe ? 1 : 0); };
function chipsFor(b, full) {
  const f = flags(b);
  return (b.exit === 0 ? ev("ran", plural(b.cases.length, "case")) : ev("gap", "no run kept")) +
    (b.broke ? ev("broke", b.broke.caught + "/" + b.broke.tried) : full ? ev("nb", "no break test") : "") +
    (f.chg ? ev("chg", "changed") : "") + (f.stale ? ev("ne", "stale summary") : "") + (f.differs ? ev("ne", "statement wrong") : "") +
    (f.dis ? ev("ne", "disagrees") : f.maybe ? ev("maybe") : "");
}
function sameSituation(b) {
  const out = [];
  for (const o of M.behaviors) { if (o.id === b.id) continue;
    for (const c of b.cases) { if (c.unparsed) continue; const oc = o.cases.find(x => x.label === c.label && !x.unparsed); if (oc) out.push({other:o, label:c.label, mine:c.fields, theirs:oc.fields}); } }
  return out;
}
function connections(b) {
  const out = [];
  for (const l of M.links) { if (l.a !== b.id && l.b !== b.id) continue;
    const other = l.a === b.id ? l.b : l.a, mine = l.a === b.id;
    let rel = "is named within a few lines of this behavior";
    if (l.feeds) { const to = l.feeds.split(">")[1]; rel = to === b.id ? "hands its result to this behavior" : "takes this behavior's result as input"; }
    out.push({other, rel, file:l.file, line: mine ? l.la : l.lb, text: mine ? l.ta : l.tb, feeds: !!l.feeds}); }
  const byFile = {};
  for (const s of M.shares) { if (s.a !== b.id && s.b !== b.id) continue; for (const f of s.files) (byFile[f] = byFile[f] || []).push(s.a === b.id ? s.b : s.a); }
  for (const [f, others] of Object.entries(byFile)) {
    if (others.length > 4) out.push({hub: true, file: f, others});   // a file most behaviors cover says little about any pair
    else for (const o of others) out.push({other: o, rel: "runs on the same code", files: [f], share: true});
  }
  return out;
}

// ---------- shell ----------
const NAV = [["home","◎","Overview"],["behaviors","▤","Behaviors"],["questions","?","Questions"],["changes","Δ","Changes"],["edges","⌇","Edges of knowledge"]];
function parseHash() { const h = location.hash.slice(1), i = h.indexOf("--"); const rs = i > 0 ? h.slice(0, i) : null, v = i > 0 ? h.slice(i + 2) : h;
  return {m: MODELS.find(x => slug(x) === rs) || M || MODELS[0], v: v || "home"}; }
const go = (v, m) => { const t = "#" + slug(m || M) + "--" + v; if (location.hash === t) route(); else location.hash = t; };
function renderShell() {
  $("#repos").innerHTML = MODELS.map(m => `<button class="repo" data-repo="${esc(slug(m))}" aria-current="${m === M}"><span class="n">${esc(m.repo)}</span><span class="c">${m.behaviors.length}</span><span class="s">${esc(m.head)}${m.dirty ? " +" + m.dirty : ""}</span></button>`).join("");
  $("#addrepo").textContent = "Add a repository: run /bw:on in it, then rebuild the atlas.";
  const asked = (store.get("bw-atlas-asked:" + slug(M)) || []).length;
  const hot = M.behaviors.filter(b => attention(b) >= 4).length, ch = M.behaviors.reduce((n, b) => n + b.changes.length, 0);
  const ct = {behaviors: M.behaviors.length, questions: M.questions.length + asked, changes: ch};
  $("#nav").innerHTML = NAV.map(([k, g, w]) => `<button data-go="${k}" aria-current="${view === k || (k === "behaviors" && view.startsWith("b-")) || (k === "questions" && view.startsWith("q-"))}"><span class="g" aria-hidden="true">${g}</span>${w}${ct[k] != null ? `<span class="ct">${ct[k]}</span>` : ""}${k === "home" && hot ? `<span class="ct hot" title="need a look">${hot}</span>` : ""}</button>`).join("");
  $("#where").textContent = `${M.repo} at ${M.head}${M.dirty ? ` + ${M.dirty} uncommitted` : ""}`;
  $("#built").textContent = "built " + when(M.built).split(" ").slice(0, 2).join(" ");
  document.title = M.repo + " · bw atlas";
}
document.addEventListener("click", e => {
  const rp = e.target.closest("[data-repo]"); if (rp) { const m = MODELS.find(x => slug(x) === rp.dataset.repo); go("home", m); return; }
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); $("#side").classList.remove("open"); go(g.dataset.go); return; }
  const r = e.target.closest("[data-ref]"); if (r) { openRef(JSON.parse(r.dataset.ref)); return; }
  const c = e.target.closest("[data-case]"); if (c) { openCase(c.dataset.b, c.dataset.case); return; }
  const k = e.target.closest("[data-ev]"); if (k) { openEv(k.dataset.b, k.dataset.ev); return; }
});
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "Escape") { closeDrawer(); return; }
  if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || (!typing && (e.key === "k" || e.key === "/"))) { e.preventDefault(); go("ask"); }
  else if (!typing && e.key === "?") legend();
  else if (!typing && e.key === "[" && trail.length > 1) { const i = trail.indexOf(view); if (i > 0) go(trail[i - 1]); }
});
$("#menu").onclick = () => { const o = $("#side").classList.toggle("open"); $("#menu").setAttribute("aria-expanded", o); };
$("#keybtn").onclick = legend; $("#dx").onclick = closeDrawer;
function closeDrawer() { $("#drawer").hidden = true; }
function drawer(title, html) { $("#dt").textContent = title; $("#db").innerHTML = html; $("#drawer").hidden = false; $("#dx").focus(); }
function legend() { drawer("How to read the marks", `<p class="muted" style="font-size:13px">Each mark has its own glyph and word, so it reads without color. The same mark means the same thing on every page.</p><div class="legend">${Object.keys(EV).map(k => `<div><span>${ev(k)}</span><span>${esc(EV[k].t)} <span class="faint">It does not mean: ${esc(EV[k].not)}</span></span></div>`).join("")}</div>`); }
const refBtn = (file, line, text, label) => `<button class="ref" data-ref='${esc(JSON.stringify({file, line, text}))}'>${esc(label || base(file) + (line ? ":" + line : ""))}</button>`;
function openRef(r) {
  drawer("Read in code", `${ev("read")}<dl class="kv"><dt>File</dt><dd><code>${esc(r.file)}</code></dd><dt>Line</dt><dd>${esc(r.line || "")}</dd></dl>
  ${r.text ? `<pre>${esc(r.text)}</pre>` : ""}<p class="muted" style="font-size:13px">bw read this line from the working tree when the atlas was built. It says what the code states. Nothing here ran it.</p>`);
}
const runWords = b => b.ran.runs === 2 ? "ran twice, same output" : b.ran.stable ? "ran during a task, repeatable" : b.exit === 0 ? "ran during a task" : "no run kept";
function openCase(id, label) {
  const b = B[id], c = b.cases.find(x => x.label === label); if (!c) return;
  const others = sameSituation(b).filter(s => s.label === label), dis = disFor(id, label);
  drawer("One situation, as it ran", `${ev("ran")}<dl class="kv"><dt>Behavior</dt><dd>${esc(b.id)}</dd><dt>Situation</dt><dd>${esc(label)}</dd></dl>
  <div><div class="lbl">The line the probe printed</div><pre>${esc(c.raw)}</pre></div>
  <div><div class="lbl">How it was run</div><pre>$ ${esc(b.cmd)}</pre><p class="muted" style="margin-top:6px;font-size:13px">${b.ran.runs === 2 ? "Ran twice on a clean copy of the code; both runs printed the same." : "bw ran it while an agent worked on a task and kept the output."} That shows this input gives this output on this code. It does not show other inputs.</p></div>
  ${others.map(o => `<div><div class="lbl">Same situation in ${esc(o.other.id)}</div><pre>${esc(o.other.cases.find(x => x.label === label).raw)}</pre></div>`).join("")}
  ${dis.map(d => `<div class="row">${ev(d.declared ? "ne" : "maybe")}<div><code>${esc(d.fa)}=${esc(d.va)}</code> here, <code>${esc(d.fb)}=${esc(d.vb)}</code> in ${esc(d.b)}.</div><div class="sub">${d.declared ? esc(d.says || "The agent declared these two fields mean the same thing.") + " bw compared the two runs." : "The field names are alike. Nobody has said they mean the same thing, so this may be fine."}</div></div>`).join("")}`);
}
function openEv(id, kind) {
  const b = B[id];
  if (kind === "broke") drawer("Break test", b.broke ? `${ev("broke", b.broke.caught + " of " + b.broke.tried + " caught")}<p>bw changed one small thing at a time in the code this probe covers (a comparison, a boolean, a constant) and re-ran the probe. ${b.broke.caught} of ${b.broke.tried} changes made its output differ.</p>${b.broke.missed.length ? `<div class="lbl">Breaks it did not notice</div><pre>${esc(b.broke.missed.join("\n"))}</pre>` : ""}<p class="muted" style="font-size:13px">A probe that notices planted breaks is more likely to notice a real one in the same lines. It says nothing about code it does not cover.</p>`
    : `${ev("nb")}<p>${b.source === "onboard" ? "bw did not plant breaks for this probe during onboarding, and did not record why." : "This probe was never through onboarding, which is where bw plants breaks."} The output is repeatable, but whether it would change if the code broke is unknown.</p>`);
  else if (kind === "ran") drawer("How this was run", `${ev("ran")}<pre>$ ${esc(b.cmd)}</pre><dl class="kv"><dt>Runs</dt><dd>${esc(runWords(b))}</dd>${b.ran.ms ? `<dt>Time</dt><dd>${esc(b.ran.ms)} ms</dd>` : ""}<dt>Covers</dt><dd>${b.covers.map(f => `<code>${esc(f)}</code>`).join("<br>") || "not stated"}</dd></dl><div class="lbl">Full output</div><pre>${esc(b.out)}</pre>`);
  else if (kind === "doc") { const d = b.doc;
    drawer("What the doc says", `${ev("doc")}<dl class="kv"><dt>Doc</dt><dd><code>${esc(d.source)}</code>${d.line ? ":" + d.line : ""}</dd><dt>Found</dt><dd>${d.found ? "yes" : "no"}</dd></dl><pre>${esc(d.quote)}</pre>${d.is_code ? `<p>${ev("ne", "not independent")} The quoted line is code copied into the doc. It agrees with the code because it is the code, so it does not show what anyone intended.</p>` : ""}`); }
}
function trailBar() {
  if (!trail.includes(view)) trail.push(view); if (trail.length > 7) trail = trail.slice(-7);
  const name = r => r.startsWith("b-") ? r.slice(2) : r.startsWith("q-") ? short((M.questions.find(q => "q-" + q.id === r) || {}).ask || "question", 40) : (NAV.find(n => n[0] === r) || [0, 0, r === "ask" ? "Ask" : r])[2];
  return trail.length > 1 ? `<div class="trail" aria-label="Your path"><span class="lbl">Your path</span>${trail.map(r => `<button data-go="${esc(r)}" aria-current="${r === view}">${esc(name(r))}</button>`).join("<span class=faint>›</span>")}</div>` : "";
}
const bRow = b => `<button class="bi" data-go="b-${esc(b.id)}"><span class="t">${flags(b).unseen ? '<span class="new" title="changed since you last looked"></span>' : ""}${esc(b.claim)}</span><span class="ev-s">${chipsFor(b, true)}</span><span class="id">${esc(b.id)}</span></button>`;

// ---------- overview ----------
function viewHome() {
  const all = M.behaviors, covered = new Set(all.map(b => b.area).filter(Boolean));
  const need = all.filter(b => attention(b) >= 4).sort((a, b) => attention(b) - attention(a));
  const ch = all.reduce((n, b) => n + b.changes.length, 0), nb = all.filter(b => !b.broke).length, dis = disagreements();
  const gaps = M.boundaries.length + M.unshown.length;
  let h = `<div class="sheet"><div class="head"><div class="lbl">${esc(M.repo)} · overview</div>
   <h1>${plural(all.length, "behavior")} seen running${M.areas.length ? `, in ${covered.size} of ${M.areas.length} areas of the code` : ""}.</h1>
   <p class="lede">What this system does, as probes showed it, lines bw read, and an AI agent's words, each marked. ${SEEN.at ? `You first looked on this device ${esc(when(SEEN.at))}.` : "This is your first visit on this device, so “changed” means since the last commit."}</p></div>
   <div class="tiles">
    <button class="tile" data-go="changes"><span class="n">${ch}<small>Δ</small></span><span class="d">${ch === 1 ? "value" : "values"} changed between snapshots</span></button>
    <button class="tile" data-go="edges"><span class="n">${dis.filter(d => d.declared).length + all.filter(b => b.claim_stale).length}<small>≠</small></span><span class="d">contradictions: stale summaries and probes that disagree</span></button>
    <button class="tile" data-go="edges"><span class="n">${nb}<small>of ${all.length}</small></span><span class="d">never break-tested</span></button>
    <button class="tile" data-go="edges"><span class="n">${gaps}<small>?</small></span><span class="d">things nothing here has shown</span></button>
   </div>`;
  if (need.length) h += `<section class="sec"><header><h2>Look at these first</h2><span class="q">a summary that no longer matches, two probes that disagree, or a change since you last looked</span></header><div class="card blist">${need.map(bRow).join("")}</div></section>`;
  h += `<section class="sec"><header><h2>What it does</h2><span class="q">grouped by what people get from it</span><button class="btn" data-go="behaviors" style="margin-left:auto">All behaviors</button></header>`;
