<title>__REPO__ behavior atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: index rail | one focused sheet | evidence drawer on demand. Evidence kinds keep one glyph + one hue everywhere. */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --fg:#1c2124; --muted:#5d666b; --faint:#8a9397; --line:#dde1df; --tint:#eceeec;
  --accent:#24508f; --accent-soft:#e3eaf5;
  --ran:#1d6b54; --ran-soft:#e0f0e9; --read:#2f5d9a; --read-soft:#e4ecf7; --says:#6b5a86; --says-soft:#eeeaf4;
  --gap:#8a5a00; --gap-soft:#f8eed9; --chg:#a3461d; --chg-soft:#f8e6dc; --ne:#a8322a; --ne-soft:#f7e1de;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121518; --panel:#191d21; --fg:#e3e7e9; --muted:#9aa4a9; --faint:#6f797e; --line:#2b3237; --tint:#20262b;
  --accent:#8db4ef; --accent-soft:#1d2a3d;
  --ran:#6fcfaa; --ran-soft:#15302a; --read:#8db4ef; --read-soft:#1b2940; --says:#bba8d9; --says-soft:#272236;
  --gap:#e5b65a; --gap-soft:#33280f; --chg:#ee9a6d; --chg-soft:#3a2216; --ne:#f08a80; --ne-soft:#3b1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --panel:#191d21; --fg:#e3e7e9; --muted:#9aa4a9; --faint:#6f797e; --line:#2b3237; --tint:#20262b;
  --accent:#8db4ef; --accent-soft:#1d2a3d;
  --ran:#6fcfaa; --ran-soft:#15302a; --read:#8db4ef; --read-soft:#1b2940; --says:#bba8d9; --says-soft:#272236;
  --gap:#e5b65a; --gap-soft:#33280f; --chg:#ee9a6d; --chg-soft:#3a2216; --ne:#f08a80; --ne-soft:#3b1c19; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.55 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code,.mono{font-family:var(--mono);font-size:12.5px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:21px;font-weight:600} h2{font-size:15px;font-weight:600} h3{font-size:13.5px;font-weight:600}
.lbl{font-family:var(--cond);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.brand{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.02em}
.brand b{color:var(--accent)}
.where{color:var(--muted);font-size:13px}
.key{display:flex;flex-wrap:wrap;gap:4px 10px;margin-left:auto;font-size:12px;color:var(--muted)}
.key span{white-space:nowrap}

/* evidence glyphs: shape + word carry the meaning, hue repeats it */
.ev{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:4px;padding:0 5px;line-height:20px;white-space:nowrap;border:0;background:none;cursor:default}
.ev i{font-style:normal;font-family:var(--mono);font-weight:500}
button.ev{cursor:pointer}
.ev.ran{color:var(--ran);background:var(--ran-soft)} .ev.broke{color:var(--ran);background:transparent;border:1px solid var(--ran-soft)}
.ev.read{color:var(--read);background:var(--read-soft)} .ev.doc{color:var(--read);background:transparent;border:1px dashed var(--read)}
.ev.says{color:var(--says);background:var(--says-soft)} .ev.gap{color:var(--gap);background:var(--gap-soft)}
.ev.chg{color:var(--chg);background:var(--chg-soft)} .ev.ne{color:var(--ne);background:var(--ne-soft)}
.ev.nb{color:var(--gap);background:transparent;border:1px dashed var(--gap)}
.ev.plain{color:var(--muted);background:var(--tint)}

/* frame */
.frame{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100% - 46px)}
.rail{border-right:1px solid var(--line);background:var(--panel);padding:12px 10px 40px 14px;overflow:auto;position:sticky;top:46px;height:calc(100vh - 46px)}
.main{min-width:0;padding-block:18px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:880px;margin:0 auto;display:grid;gap:22px}
@media (max-width:860px){.frame{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.key{margin-left:0}}

/* index */
.search{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px}
.ix{display:grid;gap:14px;margin-top:12px}
.ixbtn{display:none}
@media (max-width:860px){.ixbtn{display:block;width:100%;text-align:left;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);margin-bottom:8px}
.ixbtn::before{content:"▸ "}.rail.open .ixbtn::before{content:"▾ "}
.rail:not(.open) .ix,.rail:not(.open) .search{display:none}}
.ixg{display:grid;gap:2px}
.ixg>.lbl{padding:0 6px 4px}
.ixi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:start;text-align:left;border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;width:100%}
.ixi:hover{background:var(--tint)} .ixi[aria-current="true"]{background:var(--accent-soft)}
.ixi .t{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ixi .m{display:flex;gap:3px;font-family:var(--mono);font-size:11.5px;padding-top:1px}
.ixi .m b{font-weight:500}
.ixi .id{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--faint)}
.m .ran{color:var(--ran)} .m .chg{color:var(--chg)} .m .ne{color:var(--ne)} .m .gap{color:var(--gap)} .m .says{color:var(--says)}
.ixq{font-size:13px}

/* trail */
.trail{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;color:var(--muted);max-width:880px;margin:0 auto 14px}
.trail button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:1px 9px;cursor:pointer;font-size:12.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trail button[aria-current="true"]{border-color:var(--accent);color:var(--accent)}

/* sheet parts */
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.crumb code{color:var(--faint)}
.head{display:grid;gap:8px}
.claim{font-size:20px;font-weight:500;line-height:1.35;text-wrap:balance}
.evrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 12px;border-radius:8px;background:var(--ne-soft);color:var(--fg)}
.banner .g{font-family:var(--mono);color:var(--ne);font-weight:600}
.sec{display:grid;gap:10px}
.sec>header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.sec>header .q{color:var(--muted);font-size:13px}

/* checked statements */
.stmts{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.stmt{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:baseline;padding:5px 6px;border-radius:6px}
.stmt:hover,.stmt.hl{background:var(--tint)}
.stmt .src{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (max-width:520px){.stmt{grid-template-columns:1fr}}

/* case table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-family:var(--cond);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--tint);white-space:nowrap}
td.v{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.sit{min-width:200px}
tr.hl td{background:var(--accent-soft)}
tr.case{cursor:pointer} tr.case:hover td{background:var(--tint)}
.v-true{color:var(--ran)} .v-false{color:var(--muted)} .v-null{color:var(--faint);font-style:italic}
.was{text-decoration:line-through;color:var(--faint);margin-right:4px}
.also{display:block;font-size:11.5px;color:var(--muted)}
.tnote{font-size:12.5px;color:var(--muted)}

/* ladder */
.ladder{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 14px;display:grid;gap:10px}
.ladder svg{width:100%;height:auto;display:block}
.ladder .ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px}
.ladder input[type=range]{flex:1 1 220px;accent-color:var(--accent)}
.readout{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.readout b{font-family:var(--mono);font-weight:500}

/* lists of links, rules, readers */
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.row .sub{grid-column:2;font-size:12.5px;color:var(--muted);min-width:0}
.row .sub code{white-space:pre-wrap;word-break:break-word}
.go{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-weight:500}
.go:hover{text-decoration:underline}
.ref{border:0;background:none;padding:0;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--read);text-align:left}
.ref:hover{text-decoration:underline}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.rule .nm{font-family:var(--mono);font-size:13px}
.rule .uses{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
details{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
details>summary{cursor:pointer;padding:8px 10px;font-size:13px}
details .in{padding:0 10px 10px;display:grid;gap:4px}
.rd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:12.5px;align-items:baseline}
.rd code{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* history */
.hist{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:6px 2px 2px}
.hp{display:grid;justify-items:center;gap:3px;min-width:132px;max-width:150px;padding:0 6px;position:relative;font-size:11.5px;color:var(--muted);text-align:center}
.hp::before{content:"";position:absolute;top:9px;left:0;right:0;height:1px;background:var(--line)}
.hp:first-child::before{left:50%} .hp:last-child::before{right:50%}
.dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;position:relative;z-index:1;background:var(--panel);border:1.5px solid var(--ran);color:var(--ran)}
.dot.c{border-color:var(--chg);color:var(--chg);background:var(--chg-soft)} .dot.x{border-color:var(--gap);color:var(--gap);border-style:dashed}
.hp .when{font-family:var(--mono);color:var(--fg);white-space:nowrap}

/* question path */
.path{list-style:none;margin:0;padding:0;display:grid;gap:0}
.st{display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 12px;position:relative;padding-bottom:14px}
.st::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px}
.st.ran .k{background:var(--ran-soft);color:var(--ran)} .st.read .k{background:var(--read-soft);color:var(--read)}
.st.says .k{background:var(--says-soft);color:var(--says)} .st.gap .k{background:var(--gap-soft);color:var(--gap);border:1.5px dashed var(--gap)}
.st .b{display:grid;gap:4px;padding-top:3px;min-width:0}
.st.gap .b>.say{color:var(--gap);font-weight:500}
.st .detail{font-size:12.5px;color:var(--muted);min-width:0}
.st .detail code{white-space:pre-wrap;word-break:break-word}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.br{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);display:grid;gap:3px}
.tally{display:flex;flex-wrap:wrap;gap:6px}

/* orientation */
.cap{display:grid;gap:6px}
.cap>.ch{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cap .says-line{font-size:13px;color:var(--muted)}
.blist{display:grid;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.bi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;border-left:0;border-right:0;border-top:0;background:none;cursor:pointer;width:100%}
.bi:last-child{border-bottom:0} .bi:hover{background:var(--tint)}
.bi .t{font-size:14px} .bi .ev-s{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bi .id{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
@media (max-width:560px){.bi{grid-template-columns:1fr}.bi .ev-s{justify-content:flex-start}}
.news{display:grid;gap:6px}
.edge{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.edge>div{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.edge ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.size{display:grid;gap:3px}
.sz{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12.5px}
.sz .bar{height:8px;border-radius:2px;background:var(--tint);position:relative;overflow:hidden}
.sz .bar>span{position:absolute;inset:0 auto 0 0;background:var(--faint);opacity:.55}
.sz .bar>span.cov{background:var(--ran);opacity:.8}
.sz .n{font-family:var(--mono);text-align:right;color:var(--muted)}
.lede{font-size:15px;max-width:66ch}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:20;
  box-shadow:-12px 0 32px rgba(0,0,0,.12);display:grid;grid-template-rows:auto minmax(0,1fr);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);transform:translateX(0);transition:transform .18s ease}
.drawer[hidden]{display:grid!important;transform:translateX(105%);visibility:hidden}
.drawer .dh{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer .dh h2{flex:1;font-size:14px}
.drawer .db{overflow:auto;padding:14px;display:grid;gap:12px;align-content:start}
.x{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 9px;cursor:pointer}
pre{margin:0;background:var(--tint);border-radius:6px;padding:8px 10px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv>dt{color:var(--muted)} .kv>dd{margin:0;min-width:0;word-break:break-word}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="top">
  <div class="brand">bw <b>atlas</b></div>
  <div class="where" id="where"></div>
  <div class="key" id="key" aria-label="Evidence key"></div>
</div>
<div class="frame">
  <nav class="rail" aria-label="Behaviors">
    <button class="ixbtn" id="ixbtn" aria-expanded="false" aria-controls="ix">Index of behaviors and questions</button>
    <input class="search" id="q" type="search" placeholder="Filter behaviors, situations, rules  ( / )" aria-label="Filter">
    <div class="ix" id="ix"></div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Evidence">
  <div class="dh"><h2 id="dt">Evidence</h2><button class="x" id="dx" aria-label="Close evidence">Esc</button></div>
  <div class="db" id="db"></div>
</aside>

<script>
const M = /*__MODEL__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EV = {
  ran:{g:"▶",w:"ran",t:"A probe ran this through the real code (twice, same output)."},
  broke:{g:"⊘",w:"break-tested",t:"bw planted small breaks in the covered code; the probe's output caught them."},
  nb:{g:"⊘",w:"not break-tested",t:"bw never planted a break for this probe, so it is unknown whether the output would notice one."},
  read:{g:"⌕",w:"read in code",t:"A line of code bw read at this snapshot. It shows what the code says, not what happens when it runs."},
  doc:{g:"❝",w:"doc says",t:"A line a project document states. bw found the quote in the doc."},
  says:{g:"✎",w:"agent's words",t:"The agent's interpretation. Nothing checked it."},
  gap:{g:"?",w:"not shown",t:"Nobody could show this. The reason is given."},
  chg:{g:"Δ",w:"changed",t:"Output differs between two code snapshots."},
  ne:{g:"≠",w:"disagrees",t:"Two pieces of evidence, or a claim and its evidence, do not match."}
};
const ev = (k, word, btn, attrs) => `<${btn ? "button" : "span"} class="ev ${k}" title="${esc(EV[k].t)}" ${attrs || ""}><i>${EV[k].g}</i>${esc(word == null ? EV[k].w : word)}</${btn ? "button" : "span"}>`;
const base = f => (f || "").split("/").pop();
const when = t => { if (!t) return "time not recorded"; const d = new Date(t * 1000); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); };
const B = Object.fromEntries(M.behaviors.map(b => [b.id, b]));
const capOf = id => M.capabilities.find(c => c.behaviors.includes(id));
const shortClaim = b => b.claim.length > 110 ? b.claim.slice(0, 107) + "…" : b.claim;
const val = v => v == null ? '<span class="v-null">—</span>' : `<span class="v-${esc(v)}">${esc(v)}</span>`;
const headTime = (() => { const h = M.behaviors.flatMap(b => b.history).find(h => h.label === "last commit"); return h ? h.at : null; })();

// derived, all from the model
function marks(b) {
  const m = [];
  m.push(b.exit === 0 && b.ran.stable ? ["ran", "▶" + b.cases.length] : ["gap", "?"]);
  if (b.changes.length) m.push(["chg", "Δ" + b.changes.length]);
  const bad = (b.assertions || []).filter(a => a.status === "differs").length + (b.claim_stale ? 1 : 0);
  if (bad) m.push(["ne", "≠"]);
  if (!b.broke) m.push(["gap", "⊘?"]);
  return m;
}
function sameSituation(b) {
  const out = [];
  for (const o of M.behaviors) { if (o.id === b.id) continue;
    for (const c of b.cases) { const oc = o.cases.find(x => x.label === c.label); if (oc) out.push({other:o, label:c.label, mine:c.fields, theirs:oc.fields}); } }
  return out;
}
function connections(b) {
  const out = [];
  for (const l of M.links) { if (l.a !== b.id && l.b !== b.id) continue;
    const other = l.a === b.id ? l.b : l.a; const mine = l.a === b.id;
    let rel = "named within a few lines of this behavior";
    if (l.feeds) { const [from, to] = l.feeds.split(">"); rel = to === b.id ? "hands its result to this behavior" : "takes this behavior's result as input"; }
    out.push({other, rel, file:l.file, line: mine ? l.la : l.lb, text: mine ? l.ta : l.tb, oline: mine ? l.lb : l.la, otext: mine ? l.tb : l.ta, feeds: !!l.feeds}); }
  for (const s of M.shares) { if (s.a !== b.id && s.b !== b.id) continue;
    out.push({other: s.a === b.id ? s.b : s.a, rel:"runs on the same code", files:s.files, share:true}); }
  return out;
}

$("#where").innerHTML = `${esc(M.repo)} at <code>${esc(M.head)}</code>${M.dirty ? ` + ${M.dirty} uncommitted files` : ""} · onboarded ${esc(when(M.onboarded))}`;

let trail = [];
function renderIndex() {

$("#q").addEventListener("input", renderIndex);
document.addEventListener("click", e => {

$("#dx").onclick = closeDrawer;

const refBtn = (file, line, text, label) => `<button class="ref" data-ref='${esc(JSON.stringify({file, line, text}))}'>${esc(label || base(file) + (line ? ":" + line : ""))}</button>`;

function openCase(id, label) {

  ${others.map(o => `<div><div class="lbl">Same situation in ${esc(o.other.id)}</div><pre>${esc(o.other.cases.find(x => x.label === label).raw)}</pre></div>`).join("")}`);

function openEv(id, kind) {

    drawer("Break test", b.broke ? `${ev("broke", b.broke.caught + " of " + b.broke.tried + " caught")}<p style="margin:0">bw changed one small thing at a time in the code this probe covers (a comparison, a boolean, a constant) and re-ran the probe. ${b.broke.caught} of ${b.broke.tried} changes made its output differ.</p>${b.broke.missed.length ? `<div class="lbl">Breaks it did not notice</div><pre>${esc(b.broke.missed.join("\n"))}</pre>` : ""}<p class="muted" style="margin:0;font-size:13px">A probe that notices planted breaks is more likely to notice a real one in the same lines. It says nothing about code it does not cover.</p>`
      : `${ev("nb")}<p style="margin:0">bw did not plant breaks for this probe, and did not record why. The output is repeatable, but whether it would change if the code broke is unknown.</p><p class="muted" style="margin:0;font-size:13px">Fix in bw: record the reason (no candidate lines found, time budget, or an error) next to the result.</p>`);
  } else if (kind === "ran") {

// ---------- views ----------
function trailBar(cur) {
  if (!trail.includes(cur)) trail.push(cur); if (trail.length > 8) trail = trail.slice(-8);
  const name = r => r === "start" ? "Start" : r.startsWith("b-") ? r.slice(2) : (M.questions.find(q => "q-" + q.id === r) || {}).ask || r;
  return trail.length > 1 ? `<div class="trail" aria-label="Your path"><span class="lbl">Your path</span>${trail.map(r => `<button data-go="${esc(r)}" aria-current="${r === cur}" title="${esc(name(r))}">${esc(name(r))}</button>`).join("<span class=faint>›</span>")}</div>` : "";
}

function viewStart() {
  const all = M.behaviors;

  const stale = all.filter(b => b.claim_stale);
  const firstSeen = all.filter(b => { const h = b.history.filter(x => x.at); return h.length && headTime && h[0].at > headTime && h.some(x => x.exit === 0); })
    .map(b => ({b, at: b.history.find(x => x.exit === 0 && x.at).at, failedAtHead: b.history.some(x => x.label === "last commit" && x.exit !== 0)}));
  const nb = all.filter(b => !b.broke);

      c.behaviors.map(id => B[id]).filter(Boolean).map(b => `<button class="bi" data-go="b-${esc(b.id)}"><span class="t">${esc(b.claim)}</span><span class="ev-s">${ev("ran", b.cases.length + " cases")}${b.broke ? ev("broke", b.broke.caught + "/" + b.broke.tried) : ev("nb", "no break test")}${b.changes.length ? ev("chg", "changed") : ""}${b.claim_stale ? ev("ne", "stale summary") : ""}</span><span class="id">${esc(b.id)}</span></button>`).join("") + `</div></div>`;
  }
  h += `</section>`;
  h += `<section class="sec"><header><h2>What changed</h2><span class="q">since the last commit, ${esc(when(headTime))}. bw has no record of when you last looked.</span></header><div class="rows">`;
  for (const {b, c} of changes) h += `<div class="row">${ev("chg")}<div><button class="go" data-go="b-${esc(b.id)}">${esc(b.id)}</button>: ${c.cells.map(x => `${esc(x.label)} → <code>${esc(x.field)}</code> <span class="was">${esc(x.before)}</span><b>${esc(x.after)}</b>`).join("; ")}</div><div class="sub">between ${esc(when(c.frm))} and ${esc(when(c.to))}${c.title ? `, during the task “${esc(c.title.slice(0, 90))}…”` : ""}</div></div>`;
  for (const b of stale) h += `<div class="row">${ev("ne")}<div><button class="go" data-go="b-${esc(b.id)}">${esc(b.id)}</button>: its one-line summary was written before that change and still describes the old output.</div><div class="sub">${ev("says", "")} “${esc(shortClaim(b))}”</div></div>`;
  for (const f of firstSeen) h += `<div class="row">${ev("ran", "new")}<div><button class="go" data-go="b-${esc(f.b.id)}">${esc(f.b.id)}</button> first ran ${esc(when(f.at))}.</div>${f.failedAtHead ? `<div class="sub">At the last commit it cannot run: ${esc((f.b.history.find(x => x.label === "last commit") || {}).why || "the build failed")}. The code it checks exists only in uncommitted changes.</div>` : ""}</div>`;
  for (const b of decided) for (const d of b.decisions) h += `<div class="row">${ev("plain" in EV ? "says" : "says", "decision")}<div>You marked <button class="go" data-go="b-${esc(b.id)}">${esc(b.id)}</button> “${esc(d.decision)}” at ${esc(when(d.at))}.</div></div>`;
  if (!changes.length && !stale.length && !firstSeen.length) h += `<div class="row">${ev("ran")}<div>No probe printed anything different between the snapshots bw kept.</div></div>`;
  h += `</div></section>`;
  h += `<section class="sec"><header><h2>Where bw's knowledge ends</h2><span class="q">read this before trusting the rest</span></header><div class="edge">
    <div><div class="lbl">${EV.gap.g} Never shown</div><ul>${M.boundaries.map(x => `<li>${esc(x.say)}</li>`).join("")}${M.unshown.map(x => `<li>${esc(x.length > 170 ? x.slice(0, 167) + "…" : x)} <span class="faint">(agent)</span></li>`).join("")}</ul></div>

    <div><div class="lbl">Size and activity, not importance</div><div class="size">${M.areas.map(a => `<div class="sz"><span title="${esc(a.paths.join(", "))}">${esc(a.name)}</span><span class="bar"><span class="${a.behaviors.length ? "cov" : ""}" style="width:${(100 * a.files / maxFiles).toFixed(1)}%"></span></span><span class="n">${a.files} files</span></div>`).join("")}</div><p class="faint" style="margin:0;font-size:12.5px">Green: areas with at least one behavior run. ${M.scan.commits_12m} commits in 12 months, ${M.scan.tests} test files with ${M.scan.test_names} tests (found, not run by bw).</p></div>
  </div></section></div>`;

function words(k) { return k.replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase().split(/[^a-z]+/).filter(w => w.length > 3); }
function xDisagree(mine, theirs) {
  for (const [a, va] of Object.entries(mine)) for (const [t, vt] of Object.entries(theirs)) {
    if (a === t && va === vt) continue;
    const shared = words(a).filter(w => words(t).includes(w));
    if (shared.length && va !== vt) return `${a}=${va} here, ${t}=${vt} there`;
  }
  return "";
}
function ladderSvg(st, b) {
  const v = st.values || []; if (!v.length) return "";
  const max = v[v.length - 1] * 1.12, W = 760, x = d => 24 + (W - 48) * Math.log1p(d) / Math.log1p(max);
  const probed = b.cases.map(c => (/^day (\d+)$/.exec(c.label) || [])[1]).filter(Boolean).map(Number);
  let s = `<svg viewBox="0 0 ${W} 92" role="img" aria-label="Milestone ladder on a log scale of days">`;
  s += `<line x1="24" y1="34" x2="${W - 24}" y2="34" stroke="var(--line)" stroke-width="2"/>`;
  v.forEach(d => { s += `<g><circle cx="${x(d)}" cy="34" r="5" fill="var(--panel)" stroke="var(--read)" stroke-width="2"/><text x="${x(d)}" y="20" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--fg)">${d}</text></g>`; });
  let lastX = -99, row = 0;
  probed.sort((a, c) => a - c).forEach(d => { row = x(d) - lastX < 44 ? row + 1 : 0; lastX = x(d); s += `<g><path d="M${x(d) - 5} 52 L${x(d) + 5} 52 L${x(d)} 44 Z" fill="var(--ran)"/><text x="${x(d)}" y="${66 + row * 12}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ran)">day ${d}</text></g>`; });
  s += `<g id="lpin"><line x1="0" y1="24" x2="0" y2="44" stroke="var(--accent)" stroke-width="2"/></g></svg>`;
  return s;
}
function ladderReadout(st, b, d) {
  const v = st.values, reached = [...v].reverse().find(x => x <= d) ?? null, next = v.find(x => x > d) ?? null;
  const c = b.cases.find(x => x.label === "day " + d);
  return `<span>day <b>${d}</b>:</span> reached <b>${reached ?? "none"}</b>, next <b>${next ?? "none"}</b> ` +
    (c ? ev("ran", `ran: reached=${c.fields.reached} next=${c.fields.next}`) : ev("read", "worked out from the ladder, not run"));
}

function viewBehavior(id) {
  const b = B[id]; if (!b) return `<div class="sheet"><h1>No behavior “${esc(id)}”</h1></div>`;
  const cap = capOf(id);
  const latest = b.changes[b.changes.length - 1];
  const chgCell = (label, f) => latest && latest.cells.find(x => x.label === label && x.field === f);
  const same = sameSituation(b);
  let h = trailBar("b-" + id) + `<div class="sheet"><div class="head">
    <div class="crumb">${cap ? `<span>${esc(cap.name)}</span><span class="faint">›</span>` : ""}<code>${esc(b.id)}</code><span class="faint">· ${esc(b.area)}</span></div>
    <div class="claim">${esc(b.claim)}</div>
    <div class="evrow">${ev("says", "summary in the agent's words")}${ev("ran", "ran twice, same output", true, `data-ev="ran" data-b="${esc(id)}"`)}${b.broke ? ev("broke", `${b.broke.caught} of ${b.broke.tried} planted breaks caught`, true, `data-ev="broke" data-b="${esc(id)}"`) : ev("nb", null, true, `data-ev="broke" data-b="${esc(id)}"`)}${b.doc ? ev("doc", base(b.doc.source), true, `data-ev="doc" data-b="${esc(id)}"`) : ""}${b.entry && b.entry.file ? `<span class="muted" style="font-size:12.5px">way in ${refBtn(b.entry.file, b.entry.line, b.entry.text)}</span>` : ""}</div></div>`;
  if (b.claim_stale) h += `<div class="banner"><span class="g">≠</span><div><b>This summary is older than the output below.</b> It was written when the probe printed ${b.claim_stale.cells.map(x => `<code>${esc(x.field)}=${esc(x.before)}</code> for “${esc(x.label)}”`).join(", ")}. It now prints <code>${esc(b.claim_stale.cells[0].after)}</code>. Trust the table, then re-read the summary.</div></div>`;
  // checked statements
  const A = b.assertions || [];
  h += `<section class="sec"><header><h2>Statements, checked against the run</h2><span class="q">each one points at the row that shows it</span></header>`;
  if (A.length) h += `<ul class="stmts">` + A.map(a => {
    const k = a.status === "match" ? ev("ran", "shown") : a.status === "differs" ? ev("ne", "run says otherwise") : a.status === "no-case" ? ev("gap", "no such row") : ev("says", "not checked");
    return `<li class="stmt" ${a.case ? `data-row="${esc(a.case)}"` : ""}>${k}<div>${esc(a.says)}${a.case ? ` <span class="src">← ${esc(a.case)}: ${esc(a.field)}=${esc(a.got ?? "?")}${a.status === "differs" ? ` (statement says ${esc(a.expect)})` : ""}</span>` : ` <span class="src">no row shows this; it rests on reading the code</span>`}</div></li>`; }).join("") + `</ul>`;
  else h += `<p class="tnote" style="margin:0">The agent wrote no checkable statements for this behavior, so the only evidence is the table below. Its summary above is unchecked.</p>`;
  h += `</section>`;
  // state view
  if (b.state && b.state.kind === "ladder" && b.state.values) {
    const st = b.state;
    h += `<section class="sec"><header><h2>Where someone is on the ladder</h2><span class="q">${esc(st.unit)}; the ladder is ${refBtn(st.rule_at.file, st.rule_at.line, st.rule_at.text, "read in code")}</span></header>
    <div class="ladder">${ladderSvg(st, b)}<div class="ctl"><label for="day">Day</label><input id="day" type="range" min="0" max="400" value="9"><div class="readout" id="ro"></div></div>
    <div class="rows">${(st.notes || []).map(n => `<div class="row">${n.ok ? ev("read") : ev("says")}<div>${esc(n.says)}</div><div class="sub">${n.ok ? refBtn(n.file, n.line, n.text) + " <code>" + esc(n.text) + "</code>" : "quote not found"}</div></div>`).join("")}</div>
    <p class="tnote" style="margin:0">Triangles mark days a probe actually ran. Every other day is worked out from the ladder line in the code and has not been run.</p></div></section>`;
  }
  // cases
  h += `<section class="sec"><header><h2>What it did, situation by situation</h2>${ev("ran")}<span class="q">${b.cases.length} rows printed by <code>${esc(b.cmd)}</code></span></header><div class="tw"><table><thead><tr><th>Situation</th>${b.fields.map(f => `<th>${esc(f === "→" ? "result" : f)}</th>`).join("")}</tr></thead><tbody>` +
    b.cases.map(c => { const sm = same.filter(s => s.label === c.label);
      return `<tr class="case" data-case="${esc(c.label)}" data-b="${esc(id)}"><td class="sit">${esc(c.label)}${sm.map(s => { const dis = xDisagree(c.fields, s.theirs); return `<span class="also">${dis ? `<span class="ev ne" title="Two probes print values for similarly named fields in the same situation, and they differ"><i>≠</i> ${esc(dis)}</span> ` : ""}also run in ${esc(s.other.id)}: ${Object.entries(s.theirs).filter(([k]) => !(k in c.fields) || s.theirs[k] !== c.fields[k]).map(([k, v]) => `${esc(k)}=${esc(v)}`).join(" ") || "same values"}</span>`; }).join("")}</td>` +
      b.fields.map(f => { const x = chgCell(c.label, f), v = c.fields[f]; return `<td class="v">${x ? `<span class="ev chg" title="${esc(EV.chg.t)}"><i>Δ</i></span> <span class="was">${esc(x.before)}</span>` : ""}${f in c.fields ? val(v) : '<span class="faint">·</span>'}</td>`; }).join("") + `</tr>`; }).join("") +
    `</tbody></table></div>${latest ? `<p class="tnote" style="margin:0">${ev("chg")} marks a value that changed between ${esc(when(latest.frm))} and ${esc(when(latest.to))}.</p>` : ""}${same.length ? `<p class="tnote" style="margin:0">Rows marked “also run in” are the same situation in another probe. Where the other probe prints a different field or value, read both before trusting either.</p>` : ""}</section>`;
  // connections
  const con = connections(b);
  h += `<section class="sec"><header><h2>Connected behaviors</h2><span class="q">found by where their names meet in the code; a meeting is not proof of an effect</span></header><div class="rows">`;
  h += con.map(c => { const o = B[c.other];
    return `<div class="row">${c.share ? ev("read", "same code") : ev("read", c.feeds ? "hand-off" : "near")}<div><button class="go" data-go="b-${esc(c.other)}">${esc(c.other)}</button> ${esc(c.rel)}</div><div class="sub">${esc(shortClaim(o))}<br>${c.share ? c.files.map(f => `<code>${esc(base(f))}</code>`).join(", ") : refBtn(c.file, c.line, c.text) + ` <code>${esc(c.text)}</code>`}</div></div>`; }).join("") ||
    `<div class="row">${ev("gap")}<div>bw found no place in the code where this behavior meets another one it has run.</div><div class="sub">Name-based search misses calls through interfaces, dependency injection or another repository.</div></div>`;
  h += `</div></section>`;
  // rules and where values show up
  const rd = b.readers;
  if (b.rules.length || rd.length) {
    h += `<section class="sec"><header><h2>If this changes, what else reads it</h2><span class="q">places that name its rules and types, outside its own files</span></header><div class="rows">`;
    for (const r of b.rules) { const us = rd.filter(x => x.sym === r.name), lg = us.filter(x => x.use === "logic"), cp = us.filter(x => x.use === "copy");
      h += `<div class="rule"><div><span class="nm">${esc(r.name)}</span> <span class="muted">=</span> <code>${esc(r.value)}</code></div><div>${refBtn(r.file, r.line, r.text)}</div>
      <div class="uses"><span>${us.length ? `${lg.length} in logic, ${cp.length} in text people see` : `<span class="faint">named nowhere else</span>`}</span>${us.map(x => `${x.use === "copy" ? '<span class="faint">text</span>' : ""}${refBtn(x.file, x.line, x.text)}`).join(" ")}</div></div>`; }
    const bySym = {}; rd.filter(x => x.symkind !== "rule").forEach(x => (bySym[x.sym] = bySym[x.sym] || []).push(x));
    for (const [sym, xs] of Object.entries(bySym)) { const files = new Set(xs.map(x => x.file));
      h += `<details><summary><code>${esc(sym)}</code> is named in ${xs.length} ${xs.length === 1 ? "place" : "places"} in ${files.size} ${files.size === 1 ? "file" : "files"}</summary><div class="in">${xs.slice(0, 40).map(x => `<div class="rd">${refBtn(x.file, x.line, x.text)}<code>${esc(x.text)}</code></div>`).join("")}</div></details>`; }
    h += `<p class="tnote" style="margin:0">${ev("read")} Found by searching names. Changing a rule changes every logic line here; text lines change what people read. The probe above will show the new value; nothing has run the screens.</p></div></section>`;
  }
  // evidence and limits
  const hist = b.history;
  h += `<section class="sec"><header><h2>Why believe it, and where it stops</h2></header>
   <div><div class="lbl">Every time bw ran it</div><div class="hist">${hist.map(x => { const c = b.changes.find(c => c.to_tree === x.tree);
      return `<div class="hp"><span class="dot ${x.exit !== 0 ? "x" : c ? "c" : ""}" title="${esc(x.exit !== 0 ? x.why || "did not run" : c ? "output changed" : "same output as before")}">${x.exit !== 0 ? "×" : c ? "Δ" : "▶"}</span><span class="when">${esc(when(x.at))}</span><span>${esc(x.label === "last commit" ? "last commit" : x.task === "onboard" ? "onboarding" : x.title ? x.title.replace(/^\/bw:\w+\s*/, "").slice(0, 28) + "…" : x.label || "snapshot")}</span></div>`; }).join("")}</div>
   <p class="tnote" style="margin:4px 0 0">In order, not to scale. × means the probe could not run on that code${hist.some(x => x.exit !== 0) ? `: ${esc((hist.find(x => x.exit !== 0) || {}).why || "")}` : ""}.</p></div>
   <div class="rows">
    <div class="row">${ev("ran")}<div>Two runs on a clean copy of the code printed the same ${b.cases.length} rows.</div><div class="sub">Shows these inputs give these outputs on this code. Says nothing about inputs not in the table.</div></div>
    <div class="row">${b.broke ? ev("broke", `${b.broke.caught}/${b.broke.tried}`) : ev("nb")}<div>${b.broke ? `Caught ${b.broke.caught} of ${b.broke.tried} small breaks bw planted in its code.` : "No break was planted, so it is unknown whether this output would notice a bug."}</div></div>
    ${b.test_refs.length ? `<div class="row">${ev("read", "tests")}<div>${b.test_refs.length} lines in ${new Set(b.test_refs.map(t => t.file)).size} test files name it: ${[...new Set(b.test_refs.map(t => base(t.file)))].map(esc).join(", ")}.</div><div class="sub">Found, not run by bw. Their results are unknown here.</div></div>` : `<div class="row">${ev("gap")}<div>No test file names it.</div></div>`}
    ${b.doc ? `<div class="row">${ev("doc")}<div>${esc(b.doc.source)} quotes <code>${esc(b.doc.quote)}</code>.</div><div class="sub">${b.doc.is_code ? "The doc copies the code, so it agrees by construction. It is not a statement of intent." : "A stated rule, checked against the run above."}</div></div>` : ""}
    ${(b.assertions || []).filter(a => a.status === "unchecked").map(a => `<div class="row">${ev("says")}<div>${esc(a.says)}</div><div class="sub">The agent's reading. No row in the table shows it. A probe row for it would settle it.</div></div>`).join("")}
    ${b.decisions.map(d => `<div class="row">${ev("says", "you")}<div>Marked “${esc(d.decision)}” ${esc(when(d.at))}${d.pin ? ` at <code>${esc(d.pin)}</code>` : ""}.</div></div>`).join("")}
   </div></section></div>`;
  return h;
}

function viewQuestion(id) {
  const q = M.questions.find(x => x.id === id); if (!q) return "";
  const n = k => q.steps.filter(s => s.kind === k).length;
  let h = trailBar("q-" + id) + `<div class="sheet"><div class="head"><div class="lbl">Question</div><h1>${esc(q.ask)}</h1>
   <div class="tally">${n("ran") ? ev("ran", n("ran") + " steps ran") : ""}${n("read") ? ev("read", n("read") + " read in code") : ""}${n("says") ? ev("says", n("says") + " unchecked") : ""}${n("gap") ? ev("gap", n("gap") + " not shown") : ""}</div>
   <p class="muted" style="margin:0">The path from the person's situation to what they see. Each step says how bw knows it. Read in code means the line exists as quoted; it did not run.</p></div><ol class="path">`;
  const steps = q.steps; let i = 0;
  while (i < steps.length) {
    const s = steps[i];
    if (s.branch) { const grp = []; while (i < steps.length && steps[i].branch) grp.push(steps[i++]);
      h += `<li class="st read"><span class="k">${EV.read.g}</span><div class="b"><div class="say">Then it depends on the account:</div><div class="branches">${grp.map(g => `<div class="br"><span class="lbl">${esc(g.branch)}</span><span>${esc(g.say)}</span><span class="detail">${refBtn(g.file, g.line, g.text)} <code>${esc(g.text || g.quote)}</code></span></div>`).join("")}</div></div></li>`; continue; }
    const k = s.kind;
    let det = "";
    if (k === "ran") det = `<button class="go" data-go="b-${esc(s.behavior)}">${esc(s.behavior)}</button> · “${esc(s.case)}” → <code>${esc(Object.entries(s.got || {}).map(([a, v]) => a + "=" + v).join(" "))}</code>`;
    else if (k === "read" || (k === "gap" && s.file)) det = `${refBtn(s.file, s.line, s.text)} <code>${esc(s.text || "")}</code>${s.behavior ? ` · part of <button class="go" data-go="b-${esc(s.behavior)}">${esc(s.behavior)}</button>` : ""}`;
    else if (k === "says") det = esc(s.why || "the agent's words");
    h += `<li class="st ${k}"><span class="k">${EV[k].g}</span><div class="b"><div class="say">${esc(s.say)}</div>${det ? `<div class="detail">${det}</div>` : ""}</div></li>`;
    i++;
  }
  h += `</ol><section class="sec"><header><h2>To be sure, next</h2></header><div class="rows">
    <div class="row">${ev("gap")}<div>Run the server's limit check with a 6th message, in the backend repository. Nothing in this repository can show the refusal.</div></div>
    <div class="row">${ev("gap")}<div>Add a probe row for a signed-in free user before RevenueCat loads, to see which limit the app shows then.</div></div></div></section></div>`;
  return h;
}

document.getElementById("ixbtn").addEventListener("click", () => { const r = document.querySelector(".rail"); const o = r.classList.toggle("open"); document.getElementById("ixbtn").setAttribute("aria-expanded", o); });
document.getElementById("ix").addEventListener("click", e => { if (e.target.closest("[data-go]")) document.querySelector(".rail").classList.remove("open"); });
function route() {
  const r = location.hash.slice(1) || "start";
  let html;
  if (r.startsWith("b-")) html = viewBehavior(r.slice(2));
  else if (r.startsWith("q-")) html = viewQuestion(r.slice(2));
  else html = viewStart();
  $("#main").innerHTML = html;
  renderIndex(); closeDrawer();
  const b = r.startsWith("b-") && B[r.slice(2)];
  if (b && b.state && b.state.values) {
    const inp = $("#day"), upd = () => { const d = +inp.value; $("#ro").innerHTML = ladderReadout(b.state, b, d);
      const v = b.state.values, max = v[v.length - 1] * 1.12, x = 24 + 712 * Math.log1p(d) / Math.log1p(max); $("#lpin").setAttribute("transform", `translate(${x},0)`); };
    inp.addEventListener("input", upd); upd();
  }
  document.querySelectorAll(".stmt[data-row]").forEach(el => {
    const row = () => document.querySelector(`tr.case[data-case="${CSS.escape(el.dataset.row)}"]`);
    el.addEventListener("mouseenter", () => { const t = row(); t && t.classList.add("hl"); });
    el.addEventListener("mouseleave", () => { const t = row(); t && t.classList.remove("hl"); });
    el.addEventListener("click", () => { const t = row(); if (t) { t.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); t.classList.add("hl"); setTimeout(() => t.classList.remove("hl"), 1600); } });
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
